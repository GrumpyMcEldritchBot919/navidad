  <div class="caja">
    <h1>Navidad</h1>

  <div class="caja contenido">
    <h2>Personajes</h2>
    <p>Haz click en un personaje:</p>

    <button onclick="mostrar('Papa Noel: un señor de barba blanca y traje rojo que reparte regalos la noche del 24 de diciembre.')">
      <img src="../images/santa.jpg" width="130" alt="Papa Noel">
    </button>

    <button onclick="mostrar('Reno: tira del trineo de Papa Noel. El mas famoso es Rodolfo, el de la nariz roja.')">
      <img src="../images/reno.jpg" width="130" alt="Reno">
    </button>

    <button onclick="mostrar('Muñeco de nieve: se hace con bolas de nieve, una zanahoria de nariz y botones de carbon.')">
      <img src="../images/muneco.jpg" width="130" alt="Muñeco de nieve">
    </button>

    <button onclick="mostrar('Elfo: ayudante de Papa Noel que fabrica los juguetes en el taller del Polo Norte.')">
      <img src="../images/elfo.jpg" width="130" alt="Elfo">
    </button>

    <button onclick="mostrar('Rey Mago: los Reyes Magos llevaron oro, incienso y mirra al niño Jesus. Se celebran el 6 de enero.')">
      <img src="../images/rey.jpg" width="130" alt="Rey Mago">
    </button>

    <button onclick="mostrar('Angel: mensajero de la Navidad. Suele ponerse en la punta del arbol.')">
      <img src="../images/angel.jpg" width="130" alt="Angel">
    </button>

    <p id="descripcion" class="bloque">Aqui saldra la descripcion del personaje.</p>

    <a class="boton" href="https://maps.app.goo.gl/LxhSwXa3hSKg423bA" target="_blank" rel="noopener">¿Donde vive Papa Noel? Ver en Google Maps</a>
  </div>
